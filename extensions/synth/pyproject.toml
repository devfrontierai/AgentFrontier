[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfrontier-synth"
version = "0.1.0"
description = "AgentFrontier synthetic data: schema-driven fixtures with foreign-key integrity, masking operators, privacy and utility checks."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Pankaj Sharma" }]
dependencies = ["agentfrontier>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
